name: Laporan Bug
description: Laporkan bug atau perilaku yang tidak diharapkan
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melaporkan bug! Isi form ini dengan lengkap agar bisa diperbaiki dengan cepat.

  - type: textarea
    id: description
    attributes:
      label: Deskripsi Bug
      description: Jelaskan bug yang terjadi dengan singkat dan jelas.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah Reproduksi
      placeholder: |
        1. Buka halaman POS
        2. Tambahkan produk ke keranjang
        3. Klik tombol Bayar
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang Diharapkan
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Perilaku Aktual
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / Perangkat
      placeholder: 'Chrome 120 / Samsung Galaxy Tab A8'
    validations:
      required: true
